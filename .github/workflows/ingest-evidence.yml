name: Ingest Evidence

# Independent of PROJECT_PAUSED: no LLM spend (embeddings run locally in the
# runner), and the evidence archive should accumulate even while the consumer
# site is offline.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-all-MiniLM-L6-v2

      - name: Ingest into evidence DB
        run: pnpm run ingest:evidence
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRANSFORMERS_CACHE_DIR: .cache/transformers
          FEED_LOG_LEVEL: warn

      - name: Extract entities
        run: pnpm run extract:entities
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
